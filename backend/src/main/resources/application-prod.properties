# ==============================
# Perfil de PRODUCCION
# Los valores sensibles se inyectan por variables de entorno (ver .env.example)
# ==============================
spring.application.name=inventioryApp
server.port=8080

# Base de datos
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update

# Seguridad
jwt.secret=${JWT_SECRET}

# Correo saliente
spring.mail.host=smtp.hostinger.com
spring.mail.port=465
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.hostinger.com

# Swagger / OpenAPI
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui

# Zona horaria
spring.jackson.time-zone=America/Argentina/Buenos_Aires

# Frontend
frontend.base.url=${FRONTEND_BASE_URL}

# Cookie de autenticacion (produccion: solo por HTTPS)
auth.cookie.secure=true
auth.cookie.same-site=Lax
auth.cookie.path=/
auth.cookie.max-age=3600

# Rutas publicas (sin autenticacion)
security.public-paths=/auth/**,/subscription/**
security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
